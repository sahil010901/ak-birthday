<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 650px;
      text-align: center;
      padding: 35px 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      z-index: 5;
      animation: appear 1.5s ease;
    }

    .cake {
      font-size: 75px;
      animation: bounce 2s infinite;
    }

    h1 {
      font-size: clamp(2.3rem, 10vw, 4.5rem);
      margin: 10px 0;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
      animation: glow 2s infinite alternate;
    }

    h2 {
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      margin-bottom: 15px;
    }

    p {
      font-size: clamp(1rem, 4vw, 1.25rem);
      line-height: 1.7;
    }

    .heart {
      color: #ff1744;
      animation: heartbeat 1.2s infinite;
      display: inline-block;
    }

    button {
      margin-top: 25px;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      background: white;
      color: #e84393;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    #surprise {
      display: none;
      margin-top: 20px;
      font-size: 1.2rem;
      animation: appear 1s ease;
    }

    /* Balloons */
    .balloon {
      position: absolute;
      bottom: -150px;
      width: 55px;
      height: 70px;
      border-radius: 50%;
      animation: float 8s linear infinite;
      opacity: 0.85;
    }

    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 80px;
      background: rgba(255,255,255,0.7);
      left: 50%;
      top: 68px;
    }

    .b1 { left: 8%; background: #ff4757; animation-delay: 0s; }
    .b2 { left: 25%; background: #1e90ff; animation-delay: 2s; }
    .b3 { right: 25%; background: #2ed573; animation-delay: 4s; }
    .b4 { right: 8%; background: #ffa502; animation-delay: 1s; }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 15px;
      top: -20px;
      z-index: 10;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    @keyframes float {
      from {
        transform: translateY(0) rotate(0);
      }
      to {
        transform: translateY(-120vh) rotate(20deg);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px white; }
      to { text-shadow: 0 0 30px white, 0 0 50px #ffeb3b; }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 28px 16px;
      }

      .cake {
        font-size: 60px;
      }

      button {
        width: 85%;
      }

      .balloon {
        width: 40px;
        height: 55px;
      }
    }
  </style>
</head>

<body>

  <!-- Balloons -->
  <div class="balloon b1"></div>
  <div class="balloon b2"></div>
  <div class="balloon b3"></div>
  <div class="balloon b4"></div>

  <div class="container">

    <div class="cake">🎂</div>

    <h1>Happy Birthday!</h1>

    <!-- CHANGE NAME HERE -->
    <h2>Dear Aishwarya 💖</h2>

    <!-- CHANGE MESSAGE HERE -->
    <p>
      Wishing you a beautiful birthday filled with
      happiness, laughter and countless wonderful memories. ✨
      <br><br>
      May your smile always shine brighter than the stars.
      <span class="heart">❤️</span>
    </p>

    <button onclick="showSurprise()">
      🎁 Click for a Surprise
    </button>

    <div id="surprise">
      💕 You are truly special! 💕
      <br>
      Have the most amazing birthday ever! 🎉
    </div>

  </div>

  <script>

    // Confetti animation
    function createConfetti() {

      const colors = [
        "#ff4757",
        "#ffa502",
        "#2ed573",
        "#1e90ff",
        "#e84393",
        "#ffffff",
        "#ffeaa7"
      ];

      for (let i = 0; i < 120; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left = Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.animationDuration =
          (Math.random() * 3 + 3) + "s";

        confetti.style.animationDelay =
          Math.random() * 2 + "s";

        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 7000);
      }
    }

    // Start confetti
    createConfetti();

    // Repeat confetti
    setInterval(createConfetti, 6000);


    // Surprise button
    function showSurprise() {

      const surprise = document.getElementById("surprise");

      surprise.style.display = "block";

      // Extra celebration
      createConfetti();
      createConfetti();

      // Small vibration on supported phones
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100]);
      }
    }

  </script>

</body>
</html>
